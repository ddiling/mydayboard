# E2E smoke test: create a days-since tracker, reset it and undo the reset.
# Run: maestro test app/maestro/   (emulator running, debug APK installed)
appId: io.github.ddiling.mydayboard.debug
name: Trackers - reset a days-since tracker and undo
tags:
  - smoke
---
- launchApp:
    clearState: true
- tapOn:
    id: "open_trackers"
- tapOn: "Add tracker"
- tapOn: "Name"
- inputText: "No sugar"
- tapOn: "Days since"
- hideKeyboard # the keyboard covers the editor's lower half
- scrollUntilVisible: # the reasons section sits above Save, so Save can be below the fold
    element: "Save"
    direction: DOWN
- tapOn: "Save"
- assertVisible:
    id: "trackers_detail_reset"
- assertVisible: "No earlier streaks yet"
- tapOn:
    id: "trackers_detail_reset"
# Only a real reset moves the previous streak into the earlier list, which hides the empty-state text.
- assertNotVisible: "No earlier streaks yet"
- assertVisible: "Undo"
- tapOn: "Undo"
- assertNotVisible: "Undo"
- assertVisible: "No earlier streaks yet"
