# E2E smoke test: from the empty dashboard, an empty grid place creates a tracker, then a tap on its tile adds an event and Undo removes it.
# Run: maestro test app/maestro/   (emulator running, debug APK installed)
appId: io.github.ddiling.mydayboard.debug
name: Trackers - quick add and undo from the dashboard
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible:
    id: "empty_slot_0" # with no trackers every grid place offers "Add a tracker"
- tapOn:
    id: "empty_slot_0"
- tapOn: "Name"
- inputText: "Water"
- tapOn: "Save"
- assertVisible: "Last 7 days" # the counter detail screen opened
- back # the editor was replaced by the detail screen, so Back lands on the dashboard
- assertVisible: "0 today" # a counter with no events shows only its count
- tapOn: "Water" # a tap on the tile adds one event
- assertVisible: "Added"
- assertVisible: "1 today.*" # now "1 today · <time ago>", and Maestro matches the whole text
- tapOn: "Undo"
- assertVisible: "0 today"
