# E2E smoke test for the app.
# Run: maestro test app/maestro/   (emulator running, debug APK installed)
appId: io.github.ddiling.mydayboard.debug
name: App - tap counter
tags:
  - smoke
---
- launchApp:
    clearState: true
- tapOn:
    id: "open_counter"
- assertVisible: "You haven't tapped yet"
- tapOn:
    id: "tap_button"
- assertVisible: "You tapped once"
- tapOn:
    id: "tap_button"
- assertVisible: "You tapped 2 times"
