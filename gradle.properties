# --- Gradle ------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# --- Kotlin ------------------------------------------------------------------
kotlin.code.style=official

# --- Android -----------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Project flags (override with -P or ORG_GRADLE_PROJECT_*) ------------------
# Turn Kotlin compiler warnings into errors. CI sets this to true.
warningsAsErrors=false
# Write Compose compiler stability reports to <module>/build/compose-compiler/.
composeCompilerReports=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
