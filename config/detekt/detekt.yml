# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Keep this file small: list only what differs from the defaults.
#   Rule reference:         https://detekt.dev/docs/rules/
#   Dump the full config:   ./gradlew detektGenerateConfig
# Formatting is NOT checked here; that is ktlint's job (Spotless).
# Note: detekt 2.x renamed some rule sets/properties vs 1.x; validation below
# fails the build on unknown keys, so typos are caught immediately.

config:
  validation: true

complexity:
  LongParameterList:
    # Composables legitimately take many optional params (modifier, colors, ...).
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    # Composables are PascalCase; test names use backticks with spaces, as Kotlin's coding conventions allow in tests.
    ignoreAnnotated: ['Composable', 'Test']

style:
  # Off by default, and it only runs with type resolution (detektMain/detektTest, wired into ciStaticAnalysis).
  UnusedImport:
    active: true
  UnusedPrivateFunction:
    # Previews are called by tooling, not code; type-resolved detekt runs would flag every one.
    ignoreAnnotated: ['Preview', 'PreviewLightDark']
  MagicNumber:
    ignorePropertyDeclaration: true
    # dp/sp values in UI code and preview fixtures are not "magic".
    ignoreAnnotated: ['Composable', 'Preview', 'PreviewLightDark']
