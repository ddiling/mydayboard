// Types the Compose compiler should treat as stable even though they come from
// modules/libraries it cannot analyse. Fewer unstable params = fewer recompositions.
// Check results with: ./gradlew assembleRelease -PcomposeCompilerReports=true
// Docs: https://developer.android.com/develop/ui/compose/performance/stability/fix

// Domain models from the pure-Kotlin module (immutable data classes / sealed types)
io.github.ddiling.mydayboard.core.domain.*

// Common immutable JDK / Kotlin types
java.time.*
kotlinx.datetime.*
kotlinx.collections.immutable.*
