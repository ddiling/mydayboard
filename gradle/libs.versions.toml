[versions]
# --- Build tooling -----------------------------------------------------------
agp = "9.5.1"
# AGP 9 compiles Kotlin itself ("built-in Kotlin"). This version is still the
# one that is used: the root build declares the Kotlin plugin with `apply false`,
# which puts this KGP on the build classpath and overrides AGP's bundled one.
kotlin = "2.4.21"
detekt = "2.0.0-alpha.6"
spotless = "8.11.0"
ktlint = "1.8.0"
kover = "0.9.11"
roborazzi = "1.79.0"
composable-preview-scanner = "0.9.1"
# KSP 2.x is versioned independently of Kotlin and supports AGP 9 built-in Kotlin.
ksp = "2.3.14"
# The Hilt Gradle plugin requires AGP 9 since 2.59. The plugin, runtime, compiler
# and testing artifacts share this one version: they must always match.
hilt = "2.60.1"
# Room 2.8 (androidx.room). Room 3 is a new artifact group (androidx.room3) with a new
# package and API, so moving to it is a separate migration, not a version bump.
room = "2.8.5"

# --- Kotlin libraries --------------------------------------------------------
kotlinx-coroutines = "1.11.0"

# --- AndroidX ----------------------------------------------------------------
androidx-core = "1.19.1"
androidx-activity = "1.12.0"
# hilt-lifecycle-viewmodel-compose 1.4.0 pulls in lifecycle 2.11.0; declaring it here
# keeps the catalog equal to the version that actually ends up in the APK.
androidx-lifecycle = "2.11.0"
androidx-hilt = "1.4.0"
androidx-compose-bom = "2026.09.00"
androidx-navigation = "2.10.2"

# --- Serialization -----------------------------------------------------------
# Type-safe navigation routes are @Serializable classes.
kotlinx-serialization = "1.13.0"

# --- Dependency injection ----------------------------------------------------
# JSR-330 annotations (@Inject) only: no Android, no Dagger, for pure Kotlin modules.
javax-inject = "1"

# --- Testing -----------------------------------------------------------------
junit = "4.13.2"
robolectric = "4.18"
turbine = "1.2.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "androidx-navigation" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
# hiltViewModel() for Compose: the successor of hilt-navigation-compose, without a Navigation dependency.
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javax-inject" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-compose-preview-scanner-support = { module = "io.github.takahirom.roborazzi:roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }

# --- Gradle plugins used by build-logic (compileOnly) -------------------------
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
composable-preview-scanner = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composable-preview-scanner" }
roborazzi-gradlePlugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }

# Convention plugins (defined in build-logic/)
mydayboard-android-application = { id = "mydayboard.android.application" }
mydayboard-android-library = { id = "mydayboard.android.library" }
mydayboard-android-compose = { id = "mydayboard.android.compose" }
mydayboard-android-feature = { id = "mydayboard.android.feature" }
mydayboard-android-hilt = { id = "mydayboard.android.hilt" }
mydayboard-android-room = { id = "mydayboard.android.room" }
mydayboard-root = { id = "mydayboard.root" }
mydayboard-android-screenshot = { id = "mydayboard.android.screenshot" }
mydayboard-jvm-library = { id = "mydayboard.jvm.library" }
mydayboard-quality = { id = "mydayboard.quality" }
