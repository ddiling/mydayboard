# End-to-end tests with Maestro on an Android emulator.
# Runs on main, nightly, on demand, and on a PR when both hold:
#   - it targets main, so it is next in line to merge. A PR stacked on another branch is skipped: after
#     the PR below it is squash-merged, it must be rebased onto main (or it shows the merged commits
#     again), and that push runs this. GitHub's automatic retarget alone starts no run.
#   - it changes what ends up in the app or the flows (sources, resources, build files, Maestro flows).
# The "e2e" label forces a run on any PR. The rule is automatic because a forgotten label once let a
# broken flow reach main.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# A new push or the "e2e" label cancels the older run of the same PR ("code" group). Adding any other
# label tests nothing, so it gets a group of its own (the run id): concurrency acts before the job's
# `if:`, so a shared group would let it cancel a real run.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'e2e') && github.run_id || 'code' }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect app changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did the PR change the app or the flows?
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "$changed"
          # Main sources and resources of any module, the app, Maestro flows, the build, and this workflow and its script.
          pattern='^(app/|(core|feature)/[^/]+/src/main/|(core|feature)/[^/]+/build\.gradle\.kts$|build-logic/|gradle/|[^/]+\.gradle\.kts$|gradle\.properties$|\.github/workflows/e2e\.yml$|\.github/scripts/run_maestro\.sh$)'
          if grep -qE "$pattern" <<< "$changed"; then app=true; else app=false; fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  maestro:
    name: Maestro
    needs: changes
    # `changes` is skipped outside PRs, so `!cancelled()` keeps this job from being skipped with it.
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request' ||
        (
          (github.event.action != 'labeled' || github.event.label.name == 'e2e') &&
          (
            contains(github.event.pull_request.labels.*.name, 'e2e') ||
            (github.event.pull_request.base.ref == 'main' && needs.changes.outputs.app == 'true')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: true

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Without this the emulator aborts: "FATAL | Not enough space to create userdata partition.
      # Available: 6383 MB, need 7372 MB". (The action's disk-size input does not lower that
      # requirement, it was tried and the emulator still asked for 7372 MB.) These preinstalled
      # toolchains are not used by this job.
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # One script line per command: the action runs each line as its own shell.
          script: |
            .github/scripts/run_maestro.sh

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maestro
          path: build/maestro/
          retention-days: 14
