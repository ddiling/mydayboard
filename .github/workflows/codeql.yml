# CodeQL code scanning: finds security bugs the linters do not (injection, unsafe workflow patterns).
# Three analyses, in parallel:
#   actions      our GitHub Actions workflows (script injection, untrusted checkouts, over-broad permissions)
#   python       .github/scripts/ai_review.py
#   java-kotlin  the app. Kotlin is only analysed from a real build, so this one compiles the project.
# Results appear under Security -> Code scanning. Code scanning is free for public repositories only.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries also run against code that did not change.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # lets CodeQL read workflow run details
      security-events: write # uploads the results
    strategy:
      fail-fast: false # one failing language must not hide the others
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual # build-mode "none" silently skips Kotlin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK and Gradle
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL watches the compiler run, so the build must really compile everything:
      #   --no-build-cache / --rerun-tasks   a cached task would not run the compiler and be invisible
      #   --no-daemon / --no-configuration-cache   keep the compiler inside the process CodeQL traces
      #   kotlin.compiler.execution.strategy=in-process   the Kotlin compiler daemon would be invisible too
      - name: Build the app for CodeQL
        if: matrix.language == 'java-kotlin'
        run: >-
          ./gradlew :app:assembleDebug
          --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
