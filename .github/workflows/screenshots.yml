# Shows the screenshot baselines a PR added or changed as ONE comment that is updated on every push.
name: Screenshot comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: screenshot-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    # Fork PRs get a read-only token, so commenting would fail: skip them (the repo uses own branches).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/screenshot_comment.py
