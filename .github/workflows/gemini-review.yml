# AI review of pull requests with the Gemini API.
#   - Automatic when a pull request is opened or marked ready for review, except for Dependabot.
#   - On demand for any pull request: comment `/gemini-review` (owner, members and collaborators only).
# The review is ONE comment; a re-review updates it. It is advisory and never blocks a merge.
# Logic lives in .github/scripts/gemini_review.py, the rules the model follows in docs/review-guidelines.md.
#
# Setup: repository secret GEMINI_API_KEY. Optional repository variable GEMINI_MODEL
# (default below). Free-tier prompts may be used by Google to improve its products, so
# use a dedicated key and never send a pull request that contains secrets or personal data.
name: Gemini review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: Review pull request
    # Automatic: same-repo, non-draft, not Dependabot. Dependabot pull requests get no repository
    # secrets on `pull_request` anyway, so they are reviewed only on demand.
    # On demand: a PR comment starting with /gemini-review by someone with write access. The comment
    # run uses the workflow on the default branch, so a pull request cannot change what it runs.
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body, '/gemini-review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Review with Gemini
        run: python3 .github/scripts/gemini_review.py
