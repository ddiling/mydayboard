version: 2
updates:
  # Reads gradle/libs.versions.toml
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Must come before "androidx": Dependabot puts each update in the FIRST group
      # whose pattern matches, and "androidx.hilt*" also matches "androidx.*".
      hilt:
        patterns: ["com.google.dagger*", "androidx.hilt*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      agp:
        patterns: ["com.android.tools.build*", "com.android.application", "com.android.library"]
      androidx:
        patterns: ["androidx.*"]
      testing:
        patterns: ["junit*", "org.robolectric*", "io.github.takahirom.roborazzi*", "app.cash.turbine*"]
      code-quality:
        patterns: ["dev.detekt*", "com.diffplug.spotless*"]

  # Test-only Python packages for the AI review script (hashed requirements file)
  - package-ecosystem: pip
    directory: "/.github/scripts/tests"
    schedule:
      interval: weekly
    groups:
      python-tests:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
